# basal serve --config serve.example.yml
# (`basal serve` reads basal-serve.yml from the working directory without --config; `basal init` writes a short one)
#
# Models served by one process. A request goes to the model named in its "model" field (the name in the model's
# basal.json); /v1/basal requests without the field go to default_model.

addr: 0.0.0.0:8000
systemone_dialect: typesafe        # opt-in upstream: /v1/systemone aliases /v1/basal, including default_model
mcp: "off"                        # on: stateless streamable HTTP /mcp; Host/Origin and access: docs/MCP.md
default_model: basal-1.5-max       # default: the first model
max_inflight: 1024                 # waiting + running requests of all models; more get 529
max_large_inflight: 4              # shared limit for large/chunked bodies and expanded input above 128 KiB
long_slice_ms: 100                 # least work of a long-request lane between two hand-overs of the GPU
access_log: false                  # one log line per request: [POST] 200 /v1/systemone 31 ms (queue, compute, batch)
# log_decisions: ./decisions.jsonl # optional process-wide append log of final online answers, no background batches
metrics: false                     # opt in to Prometheus collection and GET /metrics (also --metrics)
gemm_cache: .cache/gemm            # tables of `gemm_table: auto`

# Database of the whole server, used by the Batch API and API keys; without an enabled consumer none is opened.
# Without this section an enabled consumer uses the local SQLite file <data dir>/db/basal.sqlite3.
# Backends, credentials, TLS, pool and migrations: docs/DATABASE.md.
# database:
#   enabled: true                  # default when the section is written
#   backend: sqlite                # sqlite | postgresql | mssql | mongodb
#   path: /var/lib/basal/basal.sqlite3
#   auto_migrate: true             # default: true for sqlite, false for remote databases
#   # remote: connection_string_env, migration_connection_string_env, tls: {mode: verify_full}, pool
#
# API users and keys (docs/AUTH.md), off by default (no database or key is needed without it): every route except
# /health and /health/batches then needs `Authorization: Bearer bsk_...`. Users and keys live in the database above
# (or the local server database), managed with `basal users ...` and `basal keys ...`. All keys of a user share
# its Batch/Files data (its id replaces batches.owner; its limits are batches.quota.owners.<user id>).
# auth:
#   enabled: true
#   protect_metrics: false         # true: /metrics needs a key with scope `metrics`
#
# Browser UI at /ui/ (docs/UI.md), off by default; also `basal serve --ui`. With auth it needs a login of a
# `basal users` account (`basal users create ... --admin --password-stdin` for the first admin).
# ui:
#   enabled: true
#   session_ttl: 12h               # login session lifetime, 5m to 30d
#   cookie_secure: true            # false only for plain-HTTP access other than localhost
#
# Durable Batch/Files API is off by default. Local: `basal serve --batches` (without `database:` it uses the local
# server database <data dir>/db/basal.sqlite3, docs/DATABASE.md); production quota, tokens and procedures: docs/BATCHES.md. GPU background
# execution additionally needs a measured models[].batch_profile; do not copy unqualified memory or cost
# coefficients between devices/models.
# batches:
#   enabled: true
#   profile: local
#   accepting: true                # new uploads and batches
#   processing: true               # new discovery/validation/execution claims; lifecycle cleanup keeps running

models:
  - repo: Remek/basal-1.5-max      # Hugging Face repository, downloaded at start into HF_HOME (HF_TOKEN if needed)
    revision: be1b5ee7e7a9755a931262fa7fab4f59be0fd03c   # branch, tag or commit (default: main)
    # auto (default): the batch-invariant GEMM table of this model, dtype and GPU from gemm_cache, else a built-in
    # table pinned by the model profile, else generated at start (one-time, minutes; Omni uses fixed per-prompt GEMMs).
    # pinned / sha256:<digest>: reproducible, only the profile's built-in table / exactly that artifact, else an error.
    # none: algorithms timed at first use (results may depend on the batch). Otherwise the path of a
    # `basal gemm-search --invariant` table.
    gemm_table: reports/rust-cuda-1.5-max/gemm-equiv/gemm-algos-f16-invariant-groups.json
    dtype: f16                     # f16 (default), bf16, f32
    inference_mode: auto           # balanced for Basal 2.0 text on RTX 6000 Ada; accurate preserves original attention
    # Prompt/calibration options apply after model-file download, before GEMM selection and GPU weight loading,
    # to every replica and long/background fork.
    # Explicit shared CLI flags override these fields even with --config. YAML orders wins over --orders.
    # layout: canonical            # omitted: basal.json declaration, otherwise canonical; qfirst/state_twice need
    #                              # prompt format 2 (unsupported by this format-1 basal-1.5-max)
    # orders: auto                 # omitted: fmt1=2, fmt2=1; also 1, 2, 2le<N>
    # calibration: ./fitted.json   # explicit file, never replaced by an automatic orders variant
    no_calibration: false          # true: no file read; conflicts with calibration
    strict_calibration: false      # explicit file identity mismatch: false warns/retains, true refuses startup
    auto_tau: 0.6                  # finite [0,1]; adaptive orders only
    # Native thinking: ONLY basal-2.0-4.5B at e5ba9149760d99b73b1963d8e0ccf948b58afacb with full think/ weights.
    # Trained exits: ONLY Remek/basal-1.0-4.5B@b95288041cb1975bb930c6f0410819273fd2f54f.
    # Run that model with global CLI --kernels candle --readout f32 (single CUDA, no quantization/media/thinking).
    # early_exit: "off"            # explicit opt-in to head-capable full-depth default; omitted both = plain backend
    # exit_heads: ./exit_heads     # optional local published heads.pt + thresholds.json; alone defaults to off
    # A request's early_exit overrides this default immutably. Details and qualification GAP: docs/EARLY_EXIT.md.
    # think: off                   # off (default, no second download/load) or auto
    # think_tokens: 256            # positive, +16 below think_max_len
    # think_max_len: 8192          # additionally capped by the actual think checkpoint context
    # think_calibration: off       # PATH or off; omitted: root CALIBRATION.think.json, missing => T=1
    # Both full checkpoints remain resident. See docs/THINKING.md for memory, request modes and qualification gaps.
    auto_band: [0.2, 0.8]           # exactly two finite values in [0,1], LO <= HI; inclusive noul band
    context_overflow: refuse       # our default (upstream defaults to truncate); text only, media always refuse
    truncate_head: 0.3333333333333333 # finite [0,1]; keep this share at the start, the rest at the end
    # none (default): dense weights of dtype. q8_0: the q|k|v, o, gate|up and down projections of every layer stay
    # on the GPU as 8-bit GGML Q8_0 blocks and are dequantized to f16 before each projection GEMM (f16 activations):
    # less GPU memory for those weights, more work on every forward. CUDA with dtype f16 (auto for Llama) and Llama
    # models only (basal-1.5, Basal 2.0; an Omni model is refused once its config is read); checked before loading.
    # Every replica of the model uses it. Also `basal serve --model mini --quantization q8_0`.
    # q4_k: the same with 4-bit GGML Q4_K blocks (every projection K a multiple of 256). Experimental, explicit opt-in
    # only; none is recommended. Its measured answers differ from FP32 more than with q8_0 (mini and 4.5B,
    # reports/w4a16-s1-2026-10-12). On one RTX 6000 Ada, 4.5B q4_k had a smaller GPU allocator pool after load
    # than f16 but served about 33% fewer sequential and 7% fewer mixed 16-client requests/s
    # (reports/w4a16-s2-2026-10-12); vs q8_0, a smaller pool and 0.4-1.7% more requests/s
    # (reports/w4a16-s3-2026-10-12). Request speed of mini, max and other GPUs was not measured.
    # Both change the numerics of the model.
    quantization: none
    # GPU of the model (default 0): CUDA device ordinal visible to the process. CUDA first orders all GPUs (by
    # default fastest first, which may differ from nvidia-smi; CUDA_DEVICE_ORDER=PCI_BUS_ID: PCI order, as
    # nvidia-smi), then CUDA_VISIBLE_DEVICES selects, reorders and renumbers them from 0. `basal doctor`, run with
    # the same environment, lists the ordinals. Models on one device take turns on it, models on different
    # devices run at the same time. Without replica_devices or layer_split a model is loaded once, on one GPU.
    # Metal and Intel: 0 only. Not together with replica_devices or layer_split (not even device: 0).
    device: 0
    max_batch_tokens: 8192         # packed tokens of one batch
    schedule: hrrn                 # hrrn (default) or fifo
    long_tokens: 4096              # requests above this run in the model's long lane (0: none)
    state_cache_mb: 0              # cross-request state cache (0: off)

  - path: .models/basal-1.5-4.5B   # or a local model directory
    # device: 1                    # e.g. 4.5B and mini on a second GPU
    # CUDA layer split instead of device (optional, off by default; Llama models only, Omni is refused): one model on
    # several GPUs of one type, consecutive layer ranges in layer order, the stages computed one after another (for
    # GPU memory, not for speed; not tensor parallelism). At least two stages on distinct ordinals, each with at least
    # one layer, the counts adding up to the model's layers (basal-1.5: mini 32, 4.5B 60, max 50); dtype f16 (auto for
    # Llama) and the fused kernels; not together with device (not even device: 0) or replica_devices; quantization applies to every stage. Ordinals as
    # for device (after CUDA_VISIBLE_DEVICES). Also `basal serve --model 4.5B --layer-split 0:30,1:30`.
    # layer_split:
    #   - {device: 0, layers: 30}  # layers 0-29 and the embedding
    #   - {device: 1, layers: 30}  # layers 30-59, final norm, lm_head, evidence head

  - path: .models/basal-1.5-mini
    # device: 1
    # CUDA replicas instead of device: an independent copy of the model on each listed GPU under its one name, each
    # with its own queue, scheduler, caches and long lane; a request goes to the replica with the fewest waiting and
    # running requests. Distinct ordinals of GPUs of one type (name, compute capability, SM count); several replicas
    # share one batch-invariant GEMM table checked on every GPU (Omni without a matching table: fixed per-prompt
    # GEMMs), so gemm_table must not be none. One element is the
    # same as device. Also `basal serve --model mini --replica-devices 0,1`.
    # replica_devices: [0, 1]
