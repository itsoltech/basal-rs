[package]
edition = "2018"
name = "tokenizers"
version = "0.23.2"
authors = [
    "Anthony MOI <m.anthony.moi@gmail.com>",
    "Nicolas Patry <patry.nicolas@protonmail.com>",
]
build = false
exclude = [
    "rust-toolchain",
    "target/*",
    "Cargo.lock",
    "benches/*.txt",
    "benches/*.json",
    "data/*",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
Provides an implementation of today's most used tokenizers,
with a focus on performances and versatility.
"""
homepage = "https://github.com/huggingface/tokenizers"
documentation = "https://docs.rs/tokenizers/"
readme = "README.md"
keywords = [
    "tokenizer",
    "NLP",
    "huggingface",
    "BPE",
    "WordPiece",
]
license = "Apache-2.0"
repository = "https://github.com/huggingface/tokenizers"

[package.metadata.docs.rs]
all-features = true

[features]
default = [
    "progressbar",
    "onig",
    "esaxx_fast",
]
esaxx_fast = ["esaxx-rs/cpp"]
http = ["hf-hub"]
parity-aware-bpe = []
progressbar = ["indicatif"]
rustls-tls = ["hf-hub?/rustls-tls"]
unstable_wasm = [
    "fancy-regex",
    "getrandom/wasm_js",
]

[lib]
name = "tokenizers"
path = "src/lib.rs"
bench = false

[dependencies.ahash]
version = "0.8.11"
features = ["serde"]

[dependencies.allocator-api2]
version = "=0.2.21"
