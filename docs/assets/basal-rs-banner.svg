<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">basal-rs</title>
  <desc id="desc">basal-rs: silnik inferencji w Rust zespołu IT SOL, z backendami CUDA i Metal. Modele Basal i ich trening: Remek Kinas. Wspieramy rozwój polskiego AI.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#0d1420"/>
      <stop offset="1" stop-color="#0a0f17"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1b2638" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="420" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="20" fill="url(#grid)" opacity=".3"/>
  <path d="M64 62h32" stroke="#f4ad00" stroke-width="4" stroke-linecap="round"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="110" y="68" fill="#93a3ba" font-size="16" letter-spacing="2">IT SOL / SILNIK INFERENCJI</text>
    <text x="60" y="185" fill="#f2f5fa" font-size="96" font-weight="700" letter-spacing="-5">basal<tspan fill="#f4ad00">-rs</tspan></text>
    <text x="64" y="236" fill="#c1cddd" font-size="28">Silnik inferencji w Rust.</text>
    <g font-size="15" font-weight="600" letter-spacing="1">
      <rect x="64" y="277" width="92" height="36" rx="8" fill="#f4ad00" fill-opacity=".1" stroke="#f4ad00" stroke-opacity=".36"/>
      <text x="110" y="301" text-anchor="middle" fill="#ffc23d">CUDA</text>
      <rect x="168" y="277" width="98" height="36" rx="8" fill="#f4ad00" fill-opacity=".1" stroke="#f4ad00" stroke-opacity=".36"/>
      <text x="217" y="301" text-anchor="middle" fill="#ffc23d">METAL</text>
    </g>
    <text x="64" y="367" fill="#c1cddd" font-size="20">Wspieramy rozwój polskiego AI.</text>
    <rect x="744" y="96" width="472" height="230" rx="16" fill="#111a28" stroke="#bdcaff" stroke-opacity=".3"/>
    <text x="782" y="139" fill="#93a3ba" font-size="15" letter-spacing="2">MODELE I TRENING</text>
    <text x="780" y="204" fill="#bdcaff" font-size="52" font-weight="600">Basal</text>
    <text x="782" y="250" fill="#bdcaff" font-size="30">Autor: Remek Kinas</text>
    <text x="782" y="292" fill="#93a3ba" font-size="18">github.com/rkinas/basal</text>
    <text x="980" y="367" text-anchor="middle" fill="#93a3ba" font-size="15">itsoltech/basal-rs</text>
  </g>
