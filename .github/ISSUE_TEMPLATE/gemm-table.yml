name: "Tabela GEMM / GEMM table"
description: "Tabela GEMM wygenerowana przez `basal serve` dla GPU, której wydanie jeszcze nie zawiera / A GEMM table generated by `basal serve` for a GPU the release does not ship yet"
title: "GEMM table: "
labels: [gemm-table]
body:
  - type: markdown
    attributes:
      value: |
        `basal gemm-share` tworzy to zgłoszenie sam, gdy `gh` jest zalogowany. Bez `gh` zapisuje tekst zgłoszenia w pliku `*.issue.md` obok tabeli: wklej go poniżej, a w tytule podaj GPU i model.
        Tabela zawiera nazwę GPU, wersje cuBLASLt i sterownika, model oraz konfiguracje algorytmów cuBLASLt z czasami; nic, co identyfikuje maszynę.
        `basal gemm-share` creates this issue itself when `gh` is logged in. Without `gh` it writes the issue text to a `*.issue.md` file next to the table: paste it below and put the GPU and model in the title.
        The table holds the GPU name, the cuBLASLt and driver versions, the model and cuBLASLt algorithm configurations with their timings; nothing that identifies the machine.
  - type: input
    id: version
    attributes:
      label: "`basal --version`"
    validations:
      required: true
  - type: textarea
    id: table
    attributes:
      label: "Tekst z pliku `*.issue.md` / Text of the `*.issue.md` file"
      description: "Cała zawartość pliku, razem z blokiem JSON / The whole file, with the JSON block"
    validations:
      required: true
