# Container image of the server on GitHub Container Registry (ghcr.io/<owner>/<repo>), one image for every supported
# GPU architecture (kernels for compute capability 8.0, 8.9 and 9.0, chosen at start):
#   :latest, :main, :sha-<commit>, :<version> from v* tags
#   the same tags with -sm80 / -sm90: aliases of the same image (the per-architecture images of earlier releases)
# Pull requests build the image without pushing it. The build needs no GPU; the Docker layer cache (Rust toolchain,
# dependencies with the CUDA kernels of candle) is kept in the registry under :buildcache.
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docker/**"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docker/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Free disk space (the CUDA devel image and the build need ~25 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=basal-rs
            ai.basal.cuda-compute-caps=80,89,90

      - name: Aliases -sm80 and -sm90
        id: tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "tags<<EOF"
            for t in $TAGS; do echo "$t"; echo "$t-sm80"; echo "$t-sm90"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            BASAL_GIT_SHA=${{ github.sha }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: ${{ env.PUSH == 'true' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE) || '' }}
