# Release packages: on a v* tag, the macOS (Apple Silicon) and Linux x86_64 (CUDA) packages of tools/release/, their
# SHA256SUMS and install.sh in a GitHub Release, then the Homebrew formula in itsoltech/homebrew-tap (secret
# HOMEBREW_TAP_TOKEN: a token allowed to push to that repository; without it the step is skipped).
# workflow_dispatch builds the packages as workflow artifacts without publishing anything. The container images are
# built by docker.yml for the same tags.
name: release

on:
  push:
    tags: ["v*"]
  # a release published in the web interface with a new tag (the same files; uploads replace them)
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      # dependencies of the dist profile from earlier runs (a tag run reads the cache of the default branch)
      - uses: Swatinem/rust-cache@v2
        with:
          key: dist
      - name: Package
        env:
          BASAL_GIT_SHA: ${{ github.sha }}
        run: tools/release/package-macos.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: package-macos
          path: dist/*

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space (the CUDA devel image and the build need ~25 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package
        env:
          BASAL_GIT_SHA: ${{ github.sha }}
          # builder layers (toolkit, Rust, the cargo-chef dependency layer) in the registry, next to the image cache
          BASAL_BUILD_CACHE: >-
            --cache-from type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-release-linux
            --cache-to type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-release-linux,mode=max
        run: tools/release/package-linux.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: package-linux
          path: dist/*

  publish:
    needs: [macos, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
      macos_sha256: ${{ steps.v.outputs.macos_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Version and checksums
        id: v
        run: |
          version=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml $version"; exit 1; }
          cd dist
          cat ./*.tar.gz.sha256 > SHA256SUMS
          cat SHA256SUMS
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "macos_sha256=$(awk '/aarch64-apple-darwin/{print $1}' SHA256SUMS)" >> "$GITHUB_OUTPUT"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp install.sh dist/
          # a release made in the web interface (which creates the tag) only gets the files
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber dist/*.tar.gz dist/SHA256SUMS dist/install.sh
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "basal-rs $GITHUB_REF_NAME" \
              dist/*.tar.gz dist/SHA256SUMS dist/install.sh
          fi

  homebrew:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Formula in itsoltech/homebrew-tap
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
          SHA256: ${{ needs.publish.outputs.macos_sha256 }}
        run: |
          if [ -z "$TOKEN" ]; then echo "HOMEBREW_TAP_TOKEN not set: formula not updated"; exit 0; fi
          git clone "https://x-access-token:$TOKEN@github.com/itsoltech/homebrew-tap.git" tap
          cd tap
          git checkout -B main  # also for the first push into an empty repository
          mkdir -p Formula
          sed -e "s/@VERSION@/$VERSION/g" -e "s/@SHA256@/$SHA256/g" ../tools/release/basal-rs.rb.in > Formula/basal-rs.rb
          [ -f README.md ] || cp ../tools/release/tap-README.md README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/basal-rs.rb README.md
          git diff --cached --quiet && { echo "formula unchanged"; exit 0; }
          git commit -m "basal-rs $VERSION"
          git push origin main
