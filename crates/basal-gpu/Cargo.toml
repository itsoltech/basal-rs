[package]
name = "basal-gpu"
description = "Basal 1.0 (Llama with attention/MLP biases) forward on Apple Metal or NVIDIA CUDA through candle"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[features]
# CUDA backend (Linux, NVIDIA): candle CUDA tensors, cuBLAS GEMM, fused kernels compiled with nvcc (build.rs).
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
safetensors.workspace = true
half.workspace = true
basal-core = { path = "../basal-core" }
candle-core = { workspace = true }
candle-nn = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { workspace = true, features = ["metal"] }
candle-nn = { workspace = true, features = ["metal"] }
candle-metal-kernels = "=0.11.0"
objc2-metal = "0.3"
