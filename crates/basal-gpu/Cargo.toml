[package]
name = "basal-gpu"
description = "Basal inference on Apple Metal, NVIDIA CUDA or Intel Vulkan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lints]
workspace = true

[features]
# CUDA backend (Linux, NVIDIA): candle CUDA tensors, cuBLAS GEMM, fused kernels compiled with nvcc (build.rs).
cuda = ["candle-core/cuda", "candle-nn/cuda"]
# Intel Arc (Linux): Vulkan compute through wgpu, with WGSL validation at build time.
intel = ["dep:wgpu", "dep:pollster", "dep:bytemuck", "dep:naga", "dep:ash", "dep:thiserror"]

[dependencies]
serde.workspace = true
anyhow.workspace = true
serde_json.workspace = true
safetensors.workspace = true
half.workspace = true
basal-core = { path = "../basal-core" }
candle-core = { workspace = true }
candle-nn = { workspace = true }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "vulkan", "wgsl"], optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", optional = true }
thiserror = { workspace = true, optional = true }
ash = { version = "0.38", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { workspace = true, features = ["metal"] }
candle-nn = { workspace = true, features = ["metal"] }
candle-metal-kernels = "=0.11.0"
objc2-metal = "0.3"

[build-dependencies]
naga = { version = "=30.0.1", default-features = false, features = ["wgsl-in"], optional = true }
