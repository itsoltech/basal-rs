[package]
name = "basal-cli"
description = "basal command line: decide, prompt, parity and bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "basal"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
hf-hub = { version = "1", features = ["blocking", "rustls-tls"] }
clap.workspace = true
tokio.workspace = true
axum.workspace = true
# HTTP (doctor: Hugging Face Hub) and system calls; the versions hf-hub already brings
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
libc = "0.2"
libloading = "0.8"
sha2 = "0.10"
basal-core = { path = "../basal-core" }
basal-gpu = { path = "../basal-gpu" }

[build-dependencies]
serde_json.workspace = true

[features]
cuda = ["basal-gpu/cuda"]
