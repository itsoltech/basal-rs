[package]
name = "basal-cli"
description = "basal command line: decide, prompt, parity and bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "basal"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["deserialize"] }
hf-hub = { version = "1", features = ["blocking", "rustls-tls"] }
clap.workspace = true
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "time"] }
axum = { workspace = true, features = ["multipart"] }
base64 = "0.22"
flate2 = "1"
zstd = { version = "0.13", default-features = false }
prometheus = { version = "0.14", default-features = false }
# HTTP (doctor: Hugging Face Hub) and system calls; the versions hf-hub already brings
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
libc = "0.2"
libloading = "0.8"
sha2 = "0.10"
basal-core = { path = "../basal-core" }
basal-gpu = { path = "../basal-gpu" }

[build-dependencies]
serde_json.workspace = true

[features]
cuda = ["basal-gpu/cuda"]
intel = ["basal-gpu/intel"]
