[package]
name = "basal-cli"
description = "basal command line: decide, prompt, parity and bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "basal"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
clap.workspace = true
tokio.workspace = true
axum.workspace = true
basal-core = { path = "../basal-core" }
basal-gpu = { path = "../basal-gpu" }

[features]
cuda = ["basal-gpu/cuda"]
