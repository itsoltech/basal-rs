[workspace]
resolver = "2"
members = ["crates/basal-core", "crates/basal-gpu", "crates/basal-cli"]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
indexmap = "2"
regex = "1"
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }
candle-core = { version = "=0.11.0" }
candle-nn = { version = "=0.11.0" }
safetensors = "0.8"
half = "2"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "signal", "macros"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }

[profile.release]
debug = 1

# release packages and container images: whole-program optimisation, no debug info (cargo build --profile dist)
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = 0
strip = "debuginfo"
