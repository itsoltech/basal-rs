[build-system]
requires = ["flit_core==4.1.0"]
build-backend = "flit_core.buildapi"

[project]
name = "basal-client"
version = "0.3.0"
description = "Python client for the native Basal HTTP API"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "IT SOL"}]
dependencies = ["httpx>=0.28,<1"]
classifiers = ["Programming Language :: Python :: 3", "Typing :: Typed"]

[project.urls]
Source = "https://github.com/itsoltech/basal-rs/tree/main/sdk/python"
Documentation = "https://github.com/itsoltech/basal-rs/blob/main/docs/SDK.md"

[tool.flit.module]
name = "basal_client"
